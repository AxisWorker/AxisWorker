<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">AXISWORKER — Artificial Intelligence Operations</title>
<desc id="desc">Original futuristic mission control banner with AXISWORKER typography, violet and cyan orbit, glowing grid and a small simulated system monitor.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B1A"/><stop offset=".46" stop-color="#101632"/><stop offset="1" stop-color="#080E1F"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06E5F4"/><stop offset=".52" stop-color="#7089FF"/><stop offset="1" stop-color="#B15CFF"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#4B3FAE" stop-opacity=".44"/><stop offset=".55" stop-color="#27266B" stop-opacity=".17"/><stop offset="1" stop-color="#0B1025" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 H 0 V 38" fill="none" stroke="#34416D" stroke-opacity=".30" stroke-width=".8"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1200" height="390" rx="20"/></clipPath>
</defs>
<style>
  .orbit{transform-origin:950px 190px;animation:turn 26s linear infinite}
  .orbitRev{transform-origin:950px 190px;animation:turn 34s linear infinite reverse}
  .pulse{animation:pulse 4s ease-in-out infinite}
  .scan{animation:scan 7s linear infinite}
  .blink{animation:blink 1.1s steps(1,end) infinite}
  @keyframes turn {to {transform:rotate(360deg)}}
  @keyframes pulse {50% {opacity:.35} }
  @keyframes scan {0% {transform:translateY(-240px);opacity:0} 12%,86%{opacity:.45} 100%{transform:translateY(460px);opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.orbit,.orbitRev,.pulse,.scan,.blink{animation:none!important}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="390" fill="url(#bg)"/>
  <rect width="1200" height="390" fill="url(#grid)" opacity=".7"/>
  <path d="M0 318L1200 48 M0 374L1200 104 M0 430L1200 160" stroke="#384174" opacity=".12"/>
  <rect x="13" y="13" width="1174" height="364" rx="13" fill="none" stroke="#566199" stroke-opacity=".3"/>
  <rect x="13" y="13" width="1174" height="3" fill="url(#neon)" opacity=".83"/>
  <g opacity=".7" fill="none" stroke="#59E9F4">
    <path d="M36 77V40H73 M1165 314V352H1128" stroke-width="2"/>
    <path d="M36 310V344H70 M1165 75V40H1128" stroke-width="1.4" opacity=".55"/>
  </g>
  <rect x="54" y="38" width="220" height="27" rx="5" fill="#0E2942" stroke="#2D9FBF" stroke-opacity=".7"/>
  <circle class="pulse" cx="73" cy="51.5" r="4" fill="#38F6D1"/>
  <text x="87" y="57" font-family="monospace" font-size="13" letter-spacing="1.3" fill="#8BEAFF">AXIS / SYSTEM INTERFACE</text>
  <text x="55" y="148" font-family="Arial,Helvetica,sans-serif" font-size="71" font-weight="900" letter-spacing="3" fill="#DDE9FF">AXIS</text>
  <text x="234" y="148" font-family="Arial,Helvetica,sans-serif" font-size="71" font-weight="900" letter-spacing="3" fill="url(#neon)">WORKER</text>
  <rect x="55" y="164" width="450" height="2" fill="url(#neon)" opacity=".65"/>
  <text x="56" y="211" font-family="monospace" font-size="21" letter-spacing="1" fill="#C8D5FC">WHERE INTENT BECOMES EXECUTION<tspan class="blink" fill="#2DE3F4">_</tspan></text>
  <text x="56" y="249" font-family="monospace" font-size="15" letter-spacing="1.7" fill="#8B9CCB">AUTONOMOUS-STYLE ENGINEERING COLLECTIVE</text>
  <g font-family="monospace" font-size="13" letter-spacing=".6">
    <rect x="55" y="279" width="153" height="32" rx="6" fill="#12213E" stroke="#46DDEB" stroke-opacity=".58"/>
    <text x="75" y="300" fill="#79EAEE">[ WEB / API ]</text>
    <rect x="218" y="279" width="148" height="32" rx="6" fill="#251936" stroke="#AF7BFF" stroke-opacity=".55"/>
    <text x="239" y="300" fill="#D5ADFF">[ MOBILE ]</text>
    <rect x="376" y="279" width="148" height="32" rx="6" fill="#12243F" stroke="#698FFC" stroke-opacity=".55"/>
    <text x="398" y="300" fill="#A8BAFF">[ AI / OPS ]</text>
  </g>
  <text x="56" y="351" font-family="monospace" font-size="12" letter-spacing="2" fill="#798CB8">OPERATOR: HUMAN INTENT  //  RUNTIME: AI ASSISTED  //  BUILD: IN PROGRESS</text>
  <circle cx="950" cy="190" r="235" fill="url(#halo)" class="pulse"/>
  <circle cx="950" cy="190" r="145" fill="none" stroke="#314F8F" stroke-width="1.5" stroke-dasharray="5 9" opacity=".75"/>
  <circle cx="950" cy="190" r="119" fill="none" stroke="#6F64D3" stroke-opacity=".5"/>
  <g class="orbit">
    <ellipse cx="950" cy="190" rx="170" ry="88" transform="rotate(-31 950 190)" fill="none" stroke="url(#neon)" stroke-width="2.5" opacity=".83"/>
    <circle cx="1091" cy="96" r="5" fill="#00E4F2" filter="url(#glow)"/>
  </g>
  <g class="orbitRev">
    <ellipse cx="950" cy="190" rx="171" ry="89" transform="rotate(52 950 190)" fill="none" stroke="#935AF6" stroke-width="1.8" opacity=".54"/>
    <circle cx="831" cy="97" r="4" fill="#C68DFF"/>
  </g>
  <path d="M950 96L1039 148V235L950 286L862 235V148Z" fill="#111D3A" stroke="#7584E6" stroke-width="2.2"/>
  <path d="M950 119L1018 159V223L950 264L883 223V159Z" fill="#131D41" stroke="#2DE4E7" stroke-opacity=".7"/>
  <path d="M950 135V249 M898 160L1003 223 M1003 160L898 223" stroke="#334C82" stroke-width="2"/>
  <text x="950" y="208" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="900" letter-spacing="-4" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">AW</text>
  <path d="M1135 110H1165M1135 120H1155 M754 254H777" stroke="#2DE4E7" opacity=".7"/>
  <g font-family="monospace" font-size="12" fill="#9EDFF1">
    <text x="743" y="49">SYS: AX-03</text><text x="1102" y="337">CORE / 01</text>
    <text x="759" y="337" fill="#847FBC">● FICTIONAL UI</text>
  </g>
  <rect class="scan" x="710" y="0" width="490" height="2" fill="#6AE7F9" opacity=".35"/>
</g>
</svg>